plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// Every mixin here uses remap = false (the targets are CraftPresence classes, not Minecraft ones), so no refmap is needed
loom {
    mixin {
        useLegacyMixinAp = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Compiled against only, never bundled: players install these themselves
    modCompileOnly "maven.modrinth:craftpresence:${project.craftpresence_version}"
    // Both optional at runtime: the classes using them are only loaded when the mod is present
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly fabricApi.module('fabric-command-api-v2', project.fabric_api_version)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    // Also builds craftpresence-toggle-addon-<version>-sources.jar next to the mod jar
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Declared after java { withSourcesJar() }, which is what creates this task
sourcesJar {
    from('LICENSE')
}
